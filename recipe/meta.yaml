{% set name = "omegaconf" %}
{% set version = "2.4.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/cc/10/1cabf3188a4d9684a06568c7fd76f9536eede625733c8399cf1f5337b83e/omegaconf-{{ version }}.tar.gz
  sha256: 7e219a70bea371da250285b9c01c7db027bc421722799c2cc4ff14bc4a2a753b

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    # The build regenerates the parsers with the bundled ANTLR jar.
    - openjdk
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - pyyaml >=5.1.0

test:
  imports:
    - omegaconf
  requires:
    - python {{ python_min }}
    - attrs
    - pytest
    - pytest-mock
    - typing_extensions
    - pip
  source_files:
    - tests
    - pyproject.toml
  commands:
    - pip check
    # These test upstream CI, release tooling, and the website; their inputs
    # are not included in the PyPI source distribution.
    - pytest tests --ignore-glob='tests/test_dependency_audit*.py' --ignore=tests/test_release_workflow.py --ignore-glob='tests/test_website*.py'

about:
  home: https://github.com/hydra-ecosystem/omegaconf
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - ATTRIBUTION/LICENSE-antlr4
  summary: Flexible python configuration system

  description: |
    OmegaConf is a hierarchical configuration system, with support for merging
    configurations from multiple sources (YAML config files,
    dataclasses/objects and CLI arguments) providing a consistent API
    regardless of how the configuration was created.
  doc_url: https://omegaconf.cli.dev/
  dev_url: https://github.com/hydra-ecosystem/omegaconf

extra:
  recipe-maintainers:
    - maresb
    - mdraw
    - omry
    - benjaminrwilson
