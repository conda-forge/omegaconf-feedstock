{% set name = "omegaconf" %}
{% set version = "2.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/omegaconf-{{ version }}.tar.gz
  sha256: d5d4b6d29955cc50ad50c46dc269bcd92c6e00f5f90d23ab5fee7bfca4ba4cc7

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
    - antlr 4.9
  run:
    - python >={{ python_min }}
    - pyyaml >=5.1.0
    - antlr-python-runtime 4.9

test:
  imports:
    - omegaconf
  requires:
    - attrs
    - pytest
    - pytest-benchmark
    - pytest-mock
    - pytest-lazy-fixture
    - pip
    - python {{ python_min }}
  source_files:
    - tests
  commands:
    - pytest --ignore tests/test_pydev_resolver_plugin.py
    # Work around <https://github.com/conda-forge/pytest-lazy-fixture-feedstock/issues/13>
    - pip uninstall -y pytest-lazy-fixture
    - pip check

about:
  home: https://github.com/omry/omegaconf
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Flexible python configuration system

  description: |
    OmegaConf is a hierarchical configuration system, with support for merging
    configurations from multiple sources (YAML config files,
    dataclasses/objects and CLI arguments) providing a consistent API
    regardless of how the configuration was created.
  doc_url: https://omegaconf.readthedocs.io/
  dev_url: https://github.com/omry/omegaconf

extra:
  recipe-maintainers:
    - maresb
    - mdraw
    - omry
    - benjaminrwilson
